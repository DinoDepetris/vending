<!DOCTYPE html>
<html>
<head>
    <title>Vending simulado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="header">
        <h2>Elegí tus productos</h2>
        <div class="carrito-wrapper">
            <button id="btn-carrito" onclick="alternarPreview()">
                🛒 <span id="contador-carrito">{{ resumen.cantidad_total }}</span>
            </button>
            <div id="carrito-preview" class="oculto">
                <div id="preview-items"></div>
                <p>Total: $<span id="preview-total">{{ resumen.total }}</span></p>
                <a href="/carrito" class="btn-like">Ir al carrito</a>
            </div>
        </div>
    </div>

    <div id="lista-productos">
        {% for nombre, datos in inventario.items() %}
        <div class="producto">
            <div class="producto-info">
                <span class="producto-nombre">{{ nombre }}</span>
                <span class="producto-precio">${{ datos.precio }}</span>
                <span class="producto-stock" id="stock-{{ nombre }}">stock: {{ datos.stock }}</span>
            </div>
            <div class="producto-controles">
                <input type="number" id="cantidad-{{ nombre }}" value="1" min="1"
                       max="{{ datos.stock }}" {% if datos.stock <= 0 %}disabled{% endif %}>
                <button onclick="agregarAlCarrito('{{ nombre }}')" id="btn-agregar-{{ nombre }}"
                        {% if datos.stock <= 0 %}disabled{% endif %}>
                    Agregar
                </button>
            </div>
        </div>
        {% endfor %}
    </div>

    <div id="resultado">{{ mensaje_inicial }}</div>

    <script>
        // Arrancamos con lo que ya había en el carrito guardado en la
        // sesión del servidor (por si volviste a la tienda con algo
        // adentro), y desde acá en más lo mantenemos actualizado con
        // cada respuesta que nos manda el servidor.
        let carritoActual = {
            lineas: [
                {% for linea in resumen.lineas %}
                {producto: "{{ linea.producto }}", cantidad: {{ linea.cantidad }}, subtotal: {{ linea.subtotal }}},
                {% endfor %}
            ],
            total: {{ resumen.total }},
            cantidad_total: {{ resumen.cantidad_total }}
        };

        function renderizarPreview() {
            const contenedor = document.getElementById("preview-items");
            contenedor.innerHTML = "";

            for (const linea of carritoActual.lineas) {
                const fila = document.createElement("div");
                fila.className = "carrito-linea";
                fila.innerHTML = `
                    <span>${linea.producto} x${linea.cantidad} — $${linea.subtotal}</span>
                    <button onclick="quitarDelCarrito('${linea.producto}')">Quitar</button>
                `;
                contenedor.appendChild(fila);
            }

            document.getElementById("preview-total").innerText = carritoActual.total;
            document.getElementById("contador-carrito").innerText = carritoActual.cantidad_total;
        }

        async function agregarAlCarrito(producto) {
            const input = document.getElementById("cantidad-" + producto);
            const cantidad = parseInt(input.value) || 0;

            if (cantidad <= 0) return;

            // A diferencia de la versión anterior, ahora esto le avisa
            // al SERVIDOR (no solo actualiza una variable local) —
            // porque el carrito tiene que sobrevivir aunque navegues a
            // /carrito, que es una página distinta.
            const respuesta = await fetch("/carrito/agregar", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({producto: producto, cantidad: cantidad})
            });

            carritoActual = await respuesta.json();
            renderizarPreview();
        }

        async function quitarDelCarrito(producto) {
            const respuesta = await fetch("/carrito/quitar", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({producto: producto})
            });

            carritoActual = await respuesta.json();
            renderizarPreview();
        }

        function alternarPreview() {
            document.getElementById("carrito-preview").classList.toggle("oculto");
        }

        async function actualizarBotones() {
            const respuesta = await fetch("/estado");
            const inventario = await respuesta.json();

            for (const nombre in inventario) {
                const datos = inventario[nombre];

                const stockSpan = document.getElementById("stock-" + nombre);
                const input = document.getElementById("cantidad-" + nombre);
                const boton = document.getElementById("btn-agregar-" + nombre);

                if (stockSpan) stockSpan.innerText = "stock: " + datos.stock;
                if (input) input.max = datos.stock;
                if (boton) boton.disabled = datos.stock <= 0;
            }
        }

        setInterval(actualizarBotones, 2000);
    </script>
</body>
</html>
