<!DOCTYPE html>
<html>
<head>
    <title>Tu carrito</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <h2>Tu carrito</h2>

    {% if resumen.lineas %}
        <table>
            <tr><th>Producto</th><th>Cant.</th><th>Subtotal</th><th></th></tr>
            {% for linea in resumen.lineas %}
            <tr>
                <td>{{ linea.producto }}</td>
                <td>
                    <div class="stepper-mini">
                        <form method="POST" action="/carrito/ajustar-form">
                            <input type="hidden" name="producto" value="{{ linea.producto }}">
                            <input type="hidden" name="delta" value="-1">
                            <button type="submit">−</button>
                        </form>
                        <span>{{ linea.cantidad }}</span>
                        <form method="POST" action="/carrito/ajustar-form">
                            <input type="hidden" name="producto" value="{{ linea.producto }}">
                            <input type="hidden" name="delta" value="1">
                            <button type="submit" {% if linea.cantidad >= linea.stock %}disabled{% endif %}>+</button>
                        </form>
                    </div>
                </td>
                <td>${{ linea.subtotal }}</td>
                <td>
                    <form method="POST" action="/carrito/quitar-form">
                        <input type="hidden" name="producto" value="{{ linea.producto }}">
                        <button type="submit">Quitar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>

        <p style="margin-top: 16px;"><strong>Total: ${{ resumen.total }}</strong></p>

        <form method="POST" action="/carrito/pagar">
            <button type="submit">Pagar con MercadoPago</button>
        </form>

        <!-- Botón temporal, solo para seguir probando el sistema mientras
             el sandbox de MercadoPago anda fallando — sacar cuando ya no
             haga falta. -->
        <form method="POST" action="/carrito/pagar-simulado" style="margin-top: 6px;">
            <button type="submit" style="background: #fff3cd; border-color: #ffc107;">
                ⚠️ Pago ya aprobado (solo pruebas)
            </button>
        </form>
    {% else %}
        <p>Tu carrito está vacío.</p>
    {% endif %}

    <p><a href="/">Volver a la tienda</a></p>
</body>
</html>
